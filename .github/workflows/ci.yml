name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + pruebas unitarias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  agentes:
    name: Agentes IA (lint + pruebas sin modelo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentes/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  datos:
    name: Datos (lint + pruebas del lake sin base)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: datos/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  esquema:
    name: Migraciones + pruebas de integración (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: objetos_perdidos
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/objetos_perdidos
      PRUEBAS_INTEGRACION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Subir migraciones
        run: alembic upgrade head
      - name: Pruebas de integración
        run: pytest -q tests/integracion
      - name: Bajar y volver a subir (la migración es reversible)
        run: alembic downgrade base && alembic upgrade head
      - name: Pruebas de integración de los agentes (sobre el esquema migrado)
        working-directory: agentes
        run: pip install -r requirements-dev.txt && pytest -q tests/integracion
      # Va después de los agentes: el generador mueve sus offsets al final del outbox
      - name: Generador sintético + ETL + silver/gold (lake en carpeta temporal)
        working-directory: datos
        run: pip install -r requirements-dev.txt && pytest -q tests/integracion

  compose:
    name: Docker Compose válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile core --profile datos --profile escala config -q
      - run: docker compose --profile core --profile datos build api agentes etl
